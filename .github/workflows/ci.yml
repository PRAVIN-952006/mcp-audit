name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install devDependencies
        run: npm install

      - name: Typecheck (strict TypeScript)
        run: npm run typecheck

      - name: Build dist/
        run: npm run build

      - name: Run adversarial test suite
        run: npm test

      - name: Smoke-test compiled CLI (demo + rules + SARIF)
        run: |
          node dist/cli.js rules
          node dist/cli.js demo
          node dist/cli.js demo --format sarif > /tmp/demo.sarif
          node -e "const s = JSON.parse(require('fs').readFileSync('/tmp/demo.sarif','utf8')); if (s.version !== '2.1.0' || s.runs[0].results.length < 5) process.exit(1); console.log('SARIF OK:', s.runs[0].results.length, 'findings');"

name: "MCP Audit Security Scanner"
description: "Zero-dep MCP security scanner, live tool-schema prober, Unicode stego decoder, and SHA-256 rug-pull detector."
author: "Pravin G"
branding:
  icon: "shield"
  color: "red"

inputs:
  path:
    description: "Path(s) to MCP config JSON file(s) or directory to audit (defaults to auto-discovery)."
    required: false
    default: ""
  probe:
    description: "Set to 'true' to live-probe stdio and Streamable-HTTP/SSE MCP servers via JSON-RPC 2.0."
    required: false
    default: "false"
  lockfile:
    description: "Optional path to mcp-audit.lock.json for SHA-256 rug-pull drift verification."
    required: false
    default: ""
  fail-on:
    description: "Minimum severity to fail the workflow (critical, high, medium, low)."
    required: false
    default: "high"
  sarif-file:
    description: "Optional output path to write a SARIF 2.1.0 report for GitHub Code Scanning."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Run mcp-audit
      shell: bash
      env:
        MCP_AUDIT_PROBE: ${{ inputs.probe }}
        MCP_AUDIT_PATH: ${{ inputs.path }}
        MCP_AUDIT_LOCKFILE: ${{ inputs.lockfile }}
        MCP_AUDIT_FAIL_ON: ${{ inputs.fail-on }}
        MCP_AUDIT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        CMD="scan"
        if [ "$MCP_AUDIT_PROBE" = "true" ]; then
          CMD="probe"
        fi

        ARGS=()
        if [ -n "$MCP_AUDIT_PATH" ]; then
          ARGS+=("$MCP_AUDIT_PATH")
        fi
        if [ -n "$MCP_AUDIT_LOCKFILE" ]; then
          ARGS+=("--lockfile" "$MCP_AUDIT_LOCKFILE")
        fi
        if [ -n "$MCP_AUDIT_FAIL_ON" ]; then
          ARGS+=("--fail-on" "$MCP_AUDIT_FAIL_ON")
        fi

        if [ -n "$MCP_AUDIT_SARIF_FILE" ]; then
          node "${{ github.action_path }}/src/cli.ts" "$CMD" "${ARGS[@]}" --format sarif > "$MCP_AUDIT_SARIF_FILE" || EXIT_CODE=$?
          node "${{ github.action_path }}/src/cli.ts" "$CMD" "${ARGS[@]}" || true
          exit "${EXIT_CODE:-0}"
        else
          node "${{ github.action_path }}/src/cli.ts" "$CMD" "${ARGS[@]}"
        fi
